<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Tanulói adatlap</title>

<style>
body { font-family: Arial; max-width: 900px; margin: auto; }
h1 { text-align: center; }
label { display:block; margin-top:8px; }
.section { border:1px solid #ccc; padding:12px; margin-top:20px; }
table { width:100%; border-collapse: collapse; margin-top:10px;}
td, th { border:1px solid #ccc; padding:6px; }
.hidden { display:none; }
.flex-row { display:flex; gap:10px; }
.flex-row div { flex:1; }
</style>

<script>
function toggleAllergia(){
  document.getElementById("allergia_extra").style.display =
    document.getElementById("allergia_igen").checked ? "block" : "none";
}
</script>

</head>
<body>

<h1>Tanulói adatlap</h1>

<form id="adatlap">

<div class="section">
<h3>Személyes adatok</h3>

<label>Tanuló neve <input name="nev" required></label>

<label>Neme:
<input type="radio" name="neme" value="férfi"> férfi
<input type="radio" name="neme" value="nő"> nő
</label>

<label>Tanulói azonosító száma <input name="azonosito"></label>

<label>Születési hely <input name="szuletesi_hely"></label>
<label>Születési idő <input type="date" name="szuletesi_ido"></label>

<label>Anyja lánykori neve <input name="anyja_neve"></label>

<label>Állampolgársága <input name="allampolgarsag"></label>
<label>Anyanyelve <input name="anyanyelv"></label>

<label>Külföldi tanuló tartózkodási okirat megnevezése, száma
<input name="tartozkodasi_okirat"></label>

</div>

<div class="section">
<h3>Igazolványok</h3>

<label>Személyi igazolvány száma <input name="szemelyi"></label>
<label>TAJ száma <input name="taj"></label>
<label>Adószáma <input name="adoszam"></label>

</div>

<div class="section">
<h3>Egyéb adatok</h3>

<label>Gyermekek száma <input name="gyermekek_szama"></label>

<label>Rendszeres gyermekvédelmi kedvezmény:
<input type="radio" name="kedvezmeny" value="igen"> igen
<input type="radio" name="kedvezmeny" value="nem"> nem
</label>

<label>Tartósan beteg vagy súlyosan fogyatékos:
<input type="radio" name="beteg" value="igen"> igen
<input type="radio" name="beteg" value="nem"> nem
</label>

<label>BTM:
<input type="radio" name="btm" value="igen"> igen
<input type="radio" name="btm" value="nem"> nem
</label>

<label>SNI:
<input type="radio" name="sni" value="igen"> igen
<input type="radio" name="sni" value="nem"> nem
</label>

<label>Állami gondozott:
<input type="radio" name="allami" value="igen"> igen
<input type="radio" name="allami" value="nem"> nem
</label>

<label>Szociális elhelyezésben él:
<input type="radio" name="szocialis" value="igen"> igen
<input type="radio" name="szocialis" value="nem"> nem
</label>

<label>Gyógytestnevelésre jár:
<input type="radio" name="gyogytesi" value="igen"> igen
<input type="radio" name="gyogytesi" value="nem"> nem
</label>

<label>Kollégista:
<input type="radio" name="kollegista" value="igen"> igen
<input type="radio" name="kollegista" value="nem"> nem
</label>

<label><strong>Van-e gyógyszerallergiája?</strong></label>
<input type="radio" name="allergia" value="igen" id="allergia_igen" onclick="toggleAllergia()"> igen
<input type="radio" name="allergia" value="nem" onclick="toggleAllergia()"> nem

<div id="allergia_extra" class="hidden">
<label>Milyen gyógyszerre?
<input name="allergia_reszletek"></label>
</div>

</div>

<div class="section">
<h3>Gondviselő</h3>

<label>Gondviselő neve <input name="gondviselo"></label>

<label>Rokonsági fok:
<input type="radio" name="rokonsag" value="édesapa"> édesapa
<input type="radio" name="rokonsag" value="nevelőapa"> nevelőapa
<input type="radio" name="rokonsag" value="édesanya"> édesanya
<input type="radio" name="rokonsag" value="nagyszülő"> nagyszülő
<input type="radio" name="rokonsag" value="nevelőszülő"> nevelőszülő
</label>

<label>Egyéb <input name="rokonsag_egyeb"></label>

<label>Gyermekét egyedül neveli:
<input type="radio" name="egyedul" value="igen"> igen
<input type="radio" name="egyedul" value="nem"> nem
</label>

</div>

<div class="section">
<h3>Elérhetőségek</h3>

<table>
<tr><th></th><th>Név</th><th>Telefonszám</th><th>E-mail</th></tr>

<tr>
<td>Apa</td>
<td><input name="apa_nev"></td>
<td><input name="apa_tel"></td>
<td><input name="apa_email"></td>
</tr>

<tr>
<td>Anya</td>
<td><input name="anya_nev"></td>
<td><input name="anya_tel"></td>
<td><input name="anya_email"></td>
</tr>

<tr>
<td>Tanuló</td>
<td><input name="tanulo_nev"></td>
<td><input name="tanulo_tel"></td>
<td><input name="tanulo_email"></td>
</tr>

</table>

</div>

<div class="section">
<h3>Lakóhely (lakcímkártya szerint)</h3>

<label>Irányítószám <input name="lak_irsz"></label>
<label>Település <input name="lak_telepules"></label>
<label>Utca, házszám <input name="lak_utca"></label>

<div class="flex-row">
  <div><label>Emelet <input name="lak_emelet"></label></div>
  <div><label>Ajtó <input name="lak_ajto"></label></div>
</div>

</div>

<div class="section">
<h3>Tartózkodási hely</h3>

<label>Irányítószám <input name="tart_irsz"></label>
<label>Település <input name="tart_telepules"></label>
<label>Utca, házszám <input name="tart_utca"></label>

<div class="flex-row">
  <div><label>Emelet <input name="tart_emelet"></label></div>
  <div><label>Ajtó <input name="tart_ajto"></label></div>
</div>

</div>

<div class="section">
<h3>Kitöltés</h3>
<label>Kitöltés időpontja <input type="date" name="datum"></label>
</div>

<br>
<button type="submit">Beküldés</button>

</form>

<script>
document.getElementById("adatlap").addEventListener("submit", function(e){
  e.preventDefault();

  const formData = new FormData(this);

  fetch("IDE_A_SCRIPT_URL", {
    method: "POST",
    body: formData
  })
  .then(()=>{
    alert("Sikeres beküldés!");
    this.reset();
  })
  .catch(()=>{
    alert("Hiba történt!");
  });
});
</script>

</body>
</html>
