<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Tanulói adatlap</title>

<style>
body { font-family: Arial; max-width: 900px; margin: auto; }
h1 { text-align: center; }
label { display: block; margin-top: 10px; }
.section { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
.hidden { display: none; }
</style>

<script>
function toggleAllergia() {
    const igen = document.getElementById("allergia_igen");
    const mezo = document.getElementById("allergia_reszletek");

    if (igen.checked) {
        mezo.classList.remove("hidden");
    } else {
        mezo.classList.add("hidden");
    }
}
</script>

</head>

<body>

<h1>Tanulói adatlap</h1>

<form id="adatlap">

<div class="section">
<h3>Személyes adatok</h3>

<label>Név: <input type="text" name="nev" required></label>

<label>Neme:
<input type="radio" name="neme" value="férfi"> férfi
<input type="radio" name="neme" value="nő"> nő
</label>

<label>Születési hely: <input type="text" name="szuletesi_hely"></label>
<label>Születési idő: <input type="date" name="szuletesi_ido"></label>
<label>Anyja neve: <input type="text" name="anyja_neve"></label>

<label>Állampolgárság: <input type="text" name="allampolgarsag"></label>

<label>Tartózkodási okirat:
<input type="text" name="tartozkodasi_okirat"></label>

</div>

<div class="section">
<h3>Elérhetőségek</h3>

<label>Apa neve: <input type="text" name="apa_nev"></label>
<label>Apa telefon: <input type="text" name="apa_tel"></label>

<label>Anya neve: <input type="text" name="anya_nev"></label>
<label>Anya telefon: <input type="text" name="anya_tel"></label>

</div>

<div class="section">
<h3>Egyéb</h3>

<label><strong>Van-e gyógyszerallergiája?</strong></label>

<label>
<input type="radio" name="gyogyszerallergia" id="allergia_igen" value="igen" onclick="toggleAllergia()"> igen
</label>

<label>
<input type="radio" name="gyogyszerallergia" value="nem" onclick="toggleAllergia()"> nem
</label>

<div id="allergia_reszletek" class="hidden">
<label>Milyen gyógyszerre?
<input type="text" name="allergia_reszletek"></label>
</div>

</div>

<br>
<button type="submit">Beküldés</button>

</form>

<!-- 🔥 EZ A LÉNYEG -->

<script>
document.getElementById("adatlap").addEventListener("submit", function(e){
    e.preventDefault();

    const formData = new FormData(this);

    fetch("IDE_A_SCRIPT_URL", {
        method: "POST",
        body: formData
    })
    .then(res => {
        alert("Sikeres beküldés!");
        document.getElementById("adatlap").reset();
    })
    .catch(err => {
        alert("Hiba történt!");
        console.error(err);
    });
});
</script>

</body>
</html>
