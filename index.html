<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Tanulói adatlap</title>
<style>
    body { font-family: Arial; max-width: 800px; margin: auto; }
    h1 { text-align: center; }
    label { display: block; margin-top: 10px; }
    .section { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h1>Tanulói adatlap</h1>

<form>

<div class="section">
<h3>Személyes adatok</h3>

<label>Név:
<input type="text" name="nev"></label>

<label>Neme:
<input type="radio" name="neme" value="ferfi"> férfi
<input type="radio" name="neme" value="no"> nő
</label>

<label>Tanulói azonosító:
<input type="text" name="azonosito"></label>

<label>Születési hely:
<input type="text" name="szuletesi_hely"></label>

<label>Születési idő:
<input type="date" name="szuletesi_ido"></label>

<label>Anyja leánykori neve:
<input type="text" name="anyja_neve"></label>

<label>Állampolgárság:
<input type="text" name="allampolgarsag"></label>

<label>Anyanyelv:
<input type="text" name="anyanyelv"></label>

<label>Tartózkodási okirat:
<input type="text" name="okirat"></label>
</div>

<div class="section">
<h3>Igazolványok</h3>

<label>Személyi igazolvány száma:
<input type="text" name="szemelyi"></label>

<label>TAJ szám:
<input type="text" name="taj"></label>

<label>Adószám:
<input type="text" name="adoszam"></label>
</div>

<div class="section">
<h3>Egyéb adatok</h3>

<label>Gyermekek száma a családban:
<input type="number" name="gyermekek_szama"></label>

<label>Rendszeres gyermekvédelmi kedvezmény:
<input type="radio" name="kedvezmeny" value="igen"> igen
<input type="radio" name="kedvezmeny" value="nem"> nem
</label>

<label>Tartósan beteg vagy fogyatékos:
<input type="radio" name="beteg" value="igen"> igen
<input type="radio" name="beteg" value="nem"> nem
</label>

<label>BTM tanuló:
<input type="radio" name="btm" value="igen"> igen
<input type="radio" name="btm" value="nem"> nem
</label>

<label>SNI tanuló:
<input type="radio" name="sni" value="igen"> igen
<input type="radio" name="sni" value="nem"> nem
</label>

<label>Állami gondozott:
<input type="radio" name="allami" value="igen"> igen
<input type="radio" name="allami" value="nem"> nem
</label>

<label>Szociális elhelyezés:
<input type="radio" name="szocialis" value="igen"> igen
<input type="radio" name="szocialis" value="nem"> nem
</label>

<label>Gyógytestnevelés:
<input type="radio" name="gyogytest" value="igen"> igen
<input type="radio" name="gyogytest" value="nem"> nem
</label>

<label>Kollégista:
<input type="radio" name="kollegista" value="igen"> igen
<input type="radio" name="kollegista" value="nem"> nem
</label>

</div>

<div class="section">
<h3>Gondviselő adatai</h3>

<label>Gondviselő neve:
<input type="text" name="gondviselo"></label>

<label>Rokonsági fok:</label>
<input type="radio" name="rokon" value="apa"> édesapa
<input type="radio" name="rokon" value="anya"> édesanya
<input type="radio" name="rokon" value="nagyszulo"> nagyszülő
<input type="radio" name="rokon" value="nevelo"> nevelőszülő

<label>Egyéb:
<input type="text" name="egyeb_rokon"></label>

<label>Egyedül neveli:
<input type="radio" name="egyedul" value="igen"> igen
<input type="radio" name="egyedul" value="nem"> nem
</label>

</div>

<br>
<button type="submit">Beküldés</button>

</form>

</body>
</html>
