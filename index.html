<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Regisztrációs űrlap</title>
  <style>
    body { font-family: Arial; margin: 20px; max-width: 600px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px; }
  </style>
</head>
<body>

<h1>Kitöltendő űrlap</h1>

<form onsubmit="return sendForm()">

  <!-- 1. OLDAL -->
  <h2>1. Személyes adatok</h2>

  <label>Név:</label>
  <input type="text" id="name" required>

  <label>E-mail:</label>
  <input type="email" id="email" required>

  <label>Telefonszám:</label>
  <input type="text" id="phone">

  <!-- 2. OLDAL -->
  <h2>2. További információk</h2>

  <label>Cégnév (ha van):</label>
  <input type="text" id="company">

  <label>Üzenet:</label>
  <textarea id="message" rows="5"></textarea>

  <label>Ellenőrzés (írd be: 2026):</label>
  <input type="text" id="check" required>

  <button type="submit">Küldés</button>

</form>

<script>
function sendForm() {
  if (document.getElementById("check").value !== "2026") {
    alert("Hibás ellenőrző kód!");
    return false;
  }

  const data =
    "Név: " + document.getElementById("name").value + "\n" +
    "Email: " + document.getElementById("email").value + "\n" +
    "Telefon: " + document.getElementById("phone").value + "\n" +
    "Cég: " + document.getElementById("company").value + "\n" +
    "Üzenet: " + document.getElementById("message").value;

  alert("Űrlap elküldve!\n\n" + data);

  return false;
}
</script>

</body>
</html>
